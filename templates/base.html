<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberSecurity Monitoring Platform</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-2 sidebar">

            <h4 class="text-center mb-4">
                <i class="bi bi-shield-lock-fill"></i>
                CyberSOC
            </h4>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a href="{{ url_for('dashboard') }}" class="nav-link text-white">
                        <i class="bi bi-speedometer2"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('network_scan') }}" class="nav-link text-white">
                        <i class="bi bi-broadcast"></i>
                        Network Scan
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('traffic') }}" class="nav-link text-white">
                        <i class="bi bi-activity"></i>
                        Traffic Monitor
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('firewall') }}" class="nav-link text-white">
                        <i class="bi bi-shield-fill"></i>
                        Firewall Logs
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('siem') }}" class="nav-link text-white">
                        <i class="bi bi-bar-chart-fill"></i>
                        SIEM Dashboard
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('phishing') }}" class="nav-link text-white">
                        <i class="bi bi-envelope-fill"></i>
                        Phishing Detection
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('alerts') }}" class="nav-link text-white">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Alerts
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="{{ url_for('reports') }}" class="nav-link text-white">
                        <i class="bi bi-file-earmark-text-fill"></i>
                        Reports
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->

        <div class="col-10 p-4">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
