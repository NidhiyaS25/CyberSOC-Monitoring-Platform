{% extends "base.html" %}

{% block content %}

<h2 class="fw-bold">
    <i class="bi bi-shield-fill"></i>
    Firewall Logs
</h2>

<p class="text-secondary">
    View firewall log entries.
</p>

<hr>

<form method="POST">

    <button
        type="submit"
        class="btn btn-danger">
        Load Logs
    </button>

</form>

<hr>

<h4 class="mb-3">Firewall Log Entries</h4>

<table class="table table-dark table-striped table-hover">

    <thead>

        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Action</th>
            <th>Source IP</th>
        </tr>

    </thead>

    <tbody>

    {% for log in logs %}

        <tr>

            <td>{{ log.date }}</td>

            <td>{{ log.time }}</td>

            <td>

                {% if log.action == "ACCEPT" %}

                    <span class="badge bg-success">
                        ACCEPT
                    </span>

                {% else %}

                    <span class="badge bg-danger">
                        DROP
                    </span>

                {% endif %}

            </td>

            <td>{{ log.ip }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
